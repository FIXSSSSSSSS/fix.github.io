<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jumlah Penduduk per Provinsi di Indonesia 2024</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0f14;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #e8eaf0;
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
    }

    header {
      max-width: 900px;
      margin: 0 auto 2.5rem;
    }

    .label {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: #e63946;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 800;
      line-height: 1.15;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #8a9bbb;
      margin-bottom: 1.5rem;
    }

    .stats-row {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: #181c27;
      border: 1px solid #252a3a;
      border-radius: 10px;
      padding: 0.9rem 1.3rem;
      flex: 1;
      min-width: 140px;
    }

    .stat-label {
      font-size: 0.65rem;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #5a6a8a;
      margin-bottom: 0.3rem;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
    }

    .stat-value span {
      font-size: 0.75rem;
      color: #8a9bbb;
      font-weight: 500;
      margin-left: 4px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .filter-btn {
      background: #181c27;
      border: 1px solid #252a3a;
      border-radius: 100px;
      padding: 0.35rem 0.85rem;
      font-size: 0.75rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      color: #8a9bbb;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .filter-btn .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .filter-btn:hover { border-color: #455068; color: #e8eaf0; }
    .filter-btn.active { background: #1e2535; border-color: #e63946; color: #fff; }

    .chart-area {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 190px 1fr 80px;
      align-items: center;
      gap: 0.8rem;
      opacity: 0;
      transform: translateX(-12px);
      transition: opacity 0.4s, transform 0.4s, background 0.15s;
      border-radius: 6px;
      padding: 0.25rem 0.5rem;
      cursor: default;
    }

    .bar-row.visible { opacity: 1; transform: none; }
    .bar-row:hover { background: #181c27; }

    .prov-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: #c8d0e0;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s;
    }

    .bar-row:hover .prov-name { color: #fff; }

    .bar-track {
      position: relative;
      height: 22px;
      background: #181c27;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
      position: relative;
      opacity: 0.75;
    }

    .bar-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 4px 4px 0 0;
    }

    .bar-row:hover .bar-fill { opacity: 1; }

    .bar-num {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: #8a9bbb;
      white-space: nowrap;
      text-align: right;
      transition: color 0.15s;
    }

    .bar-row:hover .bar-num { color: #e8eaf0; }

    footer {
      max-width: 900px;
      margin: 2rem auto 0;
      font-size: 0.68rem;
      color: #3a4a60;
      font-family: 'Space Mono', monospace;
      border-top: 1px solid #1a1f2d;
      padding-top: 1rem;
    }

    @media (max-width: 600px) {
      .bar-row { grid-template-columns: 130px 1fr 65px; }
      .prov-name { font-size: 0.7rem; }
      .bar-num { font-size: 0.65rem; }
    }
  </style>
</head>
<body>

  <header>
    <p class="label">● Data BPS / Dukcapil Kemendagri 2024</p>
    <h1>Jumlah Penduduk<br>per Provinsi di Indonesia</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Provinsi Terbanyak</div>
        <div class="stat-value">Jawa Barat <span>51,32 jt</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Provinsi Paling Sedikit</div>
        <div class="stat-value">Papua Selatan <span>562 rb</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Provinsi</div>
        <div class="stat-value">38 <span>provinsi</span></div>
      </div>
    </div>
  </header>

  <div class="filters" id="filters"></div>
  <div class="chart-area" id="chart"></div>

  <footer>
    SUMBER: Badan Pusat Statistik (BPS) / Dinas Kependudukan dan Pencatatan Sipil Kemendagri · 2024
  </footer>

  <script>
    const data = [
      { provinsi: "Jawa Barat",                 pulau: "Jawa",          penduduk: 51320000 },
      { provinsi: "Jawa Timur",                  pulau: "Jawa",          penduduk: 41920000 },
      { provinsi: "Jawa Tengah",                 pulau: "Jawa",          penduduk: 38430000 },
      { provinsi: "Sumatera Utara",              pulau: "Sumatera",      penduduk: 15640000 },
      { provinsi: "Banten",                      pulau: "Jawa",          penduduk: 12880000 },
      { provinsi: "DKI Jakarta",                 pulau: "Jawa",          penduduk: 11040000 },
      { provinsi: "Sulawesi Selatan",            pulau: "Sulawesi",      penduduk:  9530000 },
      { provinsi: "Lampung",                     pulau: "Sumatera",      penduduk:  9140000 },
      { provinsi: "Sumatera Selatan",            pulau: "Sumatera",      penduduk:  9060000 },
      { provinsi: "Riau",                        pulau: "Sumatera",      penduduk:  7100000 },
      { provinsi: "Sumatera Barat",              pulau: "Sumatera",      penduduk:  5820000 },
      { provinsi: "Nusa Tenggara Barat",         pulau: "Nusa Tenggara", penduduk:  5750000 },
      { provinsi: "Nusa Tenggara Timur",         pulau: "Nusa Tenggara", penduduk:  5700000 },
      { provinsi: "Kalimantan Barat",            pulau: "Kalimantan",    penduduk:  5650000 },
      { provinsi: "Aceh",                        pulau: "Sumatera",      penduduk:  5620000 },
      { provinsi: "Bali",                        pulau: "Bali",          penduduk:  4380000 },
      { provinsi: "Kalimantan Selatan",          pulau: "Kalimantan",    penduduk:  4310000 },
      { provinsi: "Kalimantan Timur",            pulau: "Kalimantan",    penduduk:  4120000 },
      { provinsi: "Jambi",                       pulau: "Sumatera",      penduduk:  3830000 },
      { provinsi: "DI Yogyakarta",               pulau: "Jawa",          penduduk:  3740000 },
      { provinsi: "Sulawesi Tengah",             pulau: "Sulawesi",      penduduk:  3220000 },
      { provinsi: "Kalimantan Tengah",           pulau: "Kalimantan",    penduduk:  2830000 },
      { provinsi: "Sulawesi Tenggara",           pulau: "Sulawesi",      penduduk:  2820000 },
      { provinsi: "Sulawesi Utara",              pulau: "Sulawesi",      penduduk:  2650000 },
      { provinsi: "Kepulauan Riau",              pulau: "Sumatera",      penduduk:  2270000 },
      { provinsi: "Bengkulu",                    pulau: "Sumatera",      penduduk:  2130000 },
      { provinsi: "Maluku",                      pulau: "Maluku",        penduduk:  1940000 },
      { provinsi: "Kepulauan Bangka Belitung",   pulau: "Sumatera",      penduduk:  1550000 },
      { provinsi: "Papua Pegunungan",            pulau: "Papua",         penduduk:  1470000 },
      { provinsi: "Sulawesi Barat",              pulau: "Sulawesi",      penduduk:  1470000 },
      { provinsi: "Maluku Utara",                pulau: "Maluku",        penduduk:  1390000 },
      { provinsi: "Papua Tengah",                pulau: "Papua",         penduduk:  1370000 },
      { provinsi: "Gorontalo",                   pulau: "Sulawesi",      penduduk:  1250000 },
      { provinsi: "Papua",                       pulau: "Papua",         penduduk:  1100000 },
      { provinsi: "Kalimantan Utara",            pulau: "Kalimantan",    penduduk:   770627 },
      { provinsi: "Papua Barat Daya",            pulau: "Papua",         penduduk:   623186 },
      { provinsi: "Papua Barat",                 pulau: "Papua",         penduduk:   576255 },
      { provinsi: "Papua Selatan",               pulau: "Papua",         penduduk:   562220 },
    ].sort((a, b) => b.penduduk - a.penduduk);

    const pulauColors = {
      "Jawa":          "#e63946",
      "Sumatera":      "#f4a261",
      "Kalimantan":    "#2a9d8f",
      "Sulawesi":      "#457b9d",
      "Papua":         "#8338ec",
      "Nusa Tenggara": "#fb8500",
      "Bali":          "#e9c46a",
      "Maluku":        "#06d6a0",
    };

    const maxPenduduk = data[0].penduduk;
    const total = data.reduce((s, d) => s + d.penduduk, 0);
    const pulauList = ["Semua", ...Object.keys(pulauColors)];
    let filterPulau = "Semua";

    function fmt(n) {
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(2).replace(/\.?0+$/, '') + ' jt';
      if (n >= 1_000)     return (n / 1_000).toFixed(0) + ' rb';
      return n.toLocaleString('id-ID');
    }

    // Subtitle
    document.getElementById('subtitle').textContent =
      `38 provinsi · Total ${(total / 1_000_000).toFixed(2)} juta jiwa · Sumber: BPS / Disdukcapil Kemendagri 2024`;

    // Render filter buttons
    function renderFilters() {
      const container = document.getElementById('filters');
      container.innerHTML = '';
      pulauList.forEach(pulau => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (pulau === filterPulau ? ' active' : '');
        if (pulau !== 'Semua') {
          const dot = document.createElement('span');
          dot.className = 'dot';
          dot.style.background = pulauColors[pulau];
          btn.appendChild(dot);
        }
        btn.appendChild(document.createTextNode(pulau));
        btn.addEventListener('click', () => {
          filterPulau = pulau;
          renderFilters();
          renderChart();
        });
        container.appendChild(btn);
      });
    }

    // Render chart bars
    function renderChart() {
      const chart = document.getElementById('chart');
      chart.innerHTML = '';

      const filtered = filterPulau === 'Semua'
        ? data
        : data.filter(d => d.pulau === filterPulau);

      filtered.forEach((row, i) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'bar-row';
        rowEl.style.transitionDelay = Math.min(i * 18, 500) + 'ms';

        const nameEl = document.createElement('span');
        nameEl.className = 'prov-name';
        nameEl.title = row.provinsi;
        nameEl.textContent = row.provinsi;

        const trackEl = document.createElement('div');
        trackEl.className = 'bar-track';

        const fillEl = document.createElement('div');
        fillEl.className = 'bar-fill';
        fillEl.style.width = '0%';
        fillEl.style.background = pulauColors[row.pulau] || '#e63946';
        fillEl.style.transitionDelay = Math.min(i * 18, 500) + 'ms';
        trackEl.appendChild(fillEl);

        const numEl = document.createElement('span');
        numEl.className = 'bar-num';
        numEl.textContent = fmt(row.penduduk);

        rowEl.appendChild(nameEl);
        rowEl.appendChild(trackEl);
        rowEl.appendChild(numEl);
        chart.appendChild(rowEl);

        // Animate in
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            rowEl.classList.add('visible');
            fillEl.style.width = (row.penduduk / maxPenduduk * 100) + '%';
          });
        });
      });
    }

    renderFilters();
    renderChart();
  </script>
</body>
</html>
